[project]
name = "codex"
version = "0.1.0"
description = "Codex through codex app-server in OpenSandbox sandboxes, as a graph served by Zorvex"
requires-python = ">=3.12"

dependencies = [
    "zorvex-cli>=0.0.5",
    "langchain-core>=1.8.4",
    "langgraph>=1.2.24",
    "codex-python[websocket]>=1.167.0",
    "opensandbox>=1.2",
    "pydantic>=2.14.4",
    "httpx>=0.28.1",
]

[tool.uv]
# The project is not installed: Zorvex puts zorvex.json's dependencies (./src) on sys.path.
package = false

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG", "SIM"]
ignore = ["E501", "ARG001", "ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["agent"]

[tool.pyright]
include = ["src"]
extraPaths = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"
